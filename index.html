<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nadhif VPN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#eef6f0;display:flex;justify-content:center}
.app{width:390px;background:#f6fbf7;min-height:100vh;position:relative}
.top{margin:15px;background:#fff;border-radius:20px;padding:16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px #0001}
.top button{background:none;border:none;font-size:24px;cursor:pointer}
.banner{margin:12px 15px;background:#0e7a46;color:#fff;border-radius:20px;padding:14px;text-align:center}
.circle{width:160px;height:160px;border-radius:50%;background:#0a6b3a;color:#fff;font-size:24px;border:none;margin:20px;cursor:pointer}
.circle.on{background:#034d27}
.card{margin:15px;background:#fff;border-radius:15px;padding:15px;box-shadow:0 2px 8px #0001}
#settings{position:absolute;top:0;left:0;width:100%;height:100%;background:#f6fbf7;z-index:99;display:none;padding:20px}
#settings.show{display:block}
input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ccc}
.btn2{width:100%;padding:12px;background:#0a6b3a;color:#fff;border:none;border-radius:12px;margin-top:10px;font-size:16px}
</style>
</head>
<body>
<div class="app">
<div class="top"><h1>نظيف VPN</h1><button onclick="openSet()">⚙️</button></div>
<div class="banner">حماية حلال - صنع في بابل</div>
<div style="text-align:center;padding:20px">
<h2 id="st">جاهز للاتصال</h2>
<button id="btn" class="circle" onclick="toggle()">اتصال</button>
<p id="st2">غير متصل</p>
</div>
<div class="card">🇸🇦 السعودية - الأسرع 24ms</div>

<div id="settings">
<h2>⚙️ الإعدادات - ولي الأمر</h2>
<p style="margin:15px 0;color:#666">هنا تگدر تغير كلمة السر اللي تمنع إيقاف الحماية</p>
<input id="old" type="password" placeholder="كلمة السر القديمة (اول مرة: babil2026)">
<input id="new1" type="password" placeholder="كلمة السر الجديدة">
<input id="new2" type="password" placeholder="تأكيد كلمة السر الجديدة">
<button class="btn2" onclick="savePass()">حفظ كلمة السر الجديدة ✅</button>
<button class="btn2" style="background:#888" onclick="closeSet()">رجوع</button>
<p id="msg" style="text-align:center;margin-top:15px;color:#0a6b3a"></p>
</div>
</div>

<script>
let on=false;
let PASSWORD = localStorage.getItem("vpn_pass") || "babil2026";

function toggle(){
let b=document.getElementById('btn'),s=document.getElementById('st');
if(!on){b.innerText='...';setTimeout(()=>{b.innerText='متصل ✅';b.classList.add('on');s.innerText='متصل الآن';on=true},800)}
else{
let p=prompt("🔒 لإيقاف الحماية، ادخل كلمة سر ولي الأمر:");
if(p===PASSWORD){b.innerText='اتصال';b.classList.remove('on');s.innerText='جاهز للاتصال';on=false}
else if(p!==null){alert("❌ كلمة السر خطأ!");}
}
}
function openSet(){document.getElementById('settings').classList.add('show')}
function closeSet(){document.getElementById('settings').classList.remove('show')}
function savePass(){
let old=document.getElementById('old').value;
let n1=document.getElementById('new1').value;
let n2=document.getElementById('new2').value;
let msg=document.getElementById('msg');
if(old!==PASSWORD){msg.innerText="❌ كلمة السر القديمة خطأ";return}
if(n1.length<4){msg.innerText="❌ كلمة السر لازم 4 أرقام أو أكثر";return}
if(n1!==n2){msg.innerText="❌ التأكيد غير مطابق";return}
localStorage.setItem("vpn_pass",n1);
PASSWORD=n1;
msg.innerText="✅ تم حفظ كلمة السر الجديدة: "+n1;
setTimeout(closeSet,1500);
}
</script>
</body>
</html>
