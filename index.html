<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظيف - حجب شامل</title>
<style>
  /* هذا يخفي كل الصور والفيديوهات */
  img, video, iframe, audio, picture, source {
    display: none !important;
    width: 0 !important;
    height: 0 !important;
  }
  body { font-family: sans-serif; text-align: center; padding: 20px; background: #f0f0f0; }
  .box { background: white; padding: 30px; border-radius: 15px; max-width: 500px; margin: 50px auto; }
</style>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
  // يحذف اي صورة او فيديو يحاول يطلع
  setInterval(() => {
    document.querySelectorAll('img, video, iframe, audio').forEach(el => el.remove());
  }, 500);
</script>
</head>
<body>
  <div class="box">
    <h1>✅ تم تفعيل الحجب الشامل</h1>
    <p>تطبيق نظيف الان يحظر جميع الصور والفيديوهات</p>
  </div>
</body>
</html>
