<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظيف</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{margin:0;background:#eef6f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:28px;width:100%;max-width:360px;padding:28px 22px;text-align:center;box-shadow:0 15px 40px #0001}
h1{color:#0a4d2a;margin:10px 0;font-size:38px}
.sub{color:#444;font-size:15px;line-height:1.6;margin:15px 0}
.btn{width:100%;background:#0a4d2a;color:#fff;border:0;padding:18px;border-radius:16px;font-size:20px;font-weight:bold}
.badge{background:#d4edda;color:#0a4d2a;padding:6px 14px;border-radius:20px;font-size:13px;display:inline-block;margin:10px 0}
.row{display:flex;align-items:center;justify-content:space-between;background:#f6f9f6;padding:14px 12px;border-radius:12px;margin:10px 0}
.switch{width:52px;height:30px;background:#ccc;border-radius:20px;position:relative}
.switch.on{background:#1a8a4a}
.switch i{position:absolute;top:3px;right:3px;width:24px;height:24px;background:#fff;border-radius:50%;display:block}
.switch.on i{right:25px}
.small{color:#777;font-size:12px;margin-top:14px}
</style>
</head>
<body>
<div class="card" id="app"></div>
<script>
let pin=localStorage.getItem('n_pin');
let active=localStorage.getItem('n_active')=='1';
let blockImg=localStorage.getItem('n_img')!=='0';
let blockVid=localStorage.getItem('n_vid')!=='0';
function render(){
 let el=document.getElementById('app');
 if(!active){
  el.innerHTML=`<h1>🛡️ نظيف</h1><div class="sub">تطبيق لحجب المواقع الإباحية وحماية<br>شباب الحلة</div><button class="btn" onclick="activate()">تفعيل الحماية</button><div class="small">ⓘ يشتغل حتى بدون انترنت</div>`;
 } else {
  el.innerHTML=`<h1>🛡️ نظيف</h1><div class="sub">تطبيق لحجب المواقع الإباحية</div><div class="badge">✓ الحماية مفعلة الآن</div><h2 style="color:#0a4d2a">رمز الحماية</h2><div class="sub">أدخل PIN للوصول</div><div class="row"><span>حجب الصور</span><div class="switch ${blockImg?'on':''}" onclick="toggle('img')"><i></i></div></div><div class="row"><span>حجب الفيديوهات</span><div class="switch ${blockVid?'on':''}" onclick="toggle('vid')"><i></i></div></div><button class="btn" style="background:#900;margin-top:12px" onclick="deactivate()">إيقاف الحماية</button><div class="small">ⓘ يشتغل حتى بدون انترنت</div>`;
 }
}
function activate(){
 if(!pin){let p=prompt('عيّن رمز PIN من 4 أرقام:');if(!p||p.length<4)return alert('قصير');pin=p;localStorage.setItem('n_pin',p);}
 let input=prompt('أدخل PIN:');if(input!==pin)return alert('خطأ');
 active=true;localStorage.setItem('n_active','1');render();
}
function deactivate(){let input=prompt('أدخل PIN للإيقاف:');if(input!==pin)return alert('خطأ');active=false;localStorage.setItem('n_active','0');render();}
function toggle(t){let input=prompt('أدخل PIN:');if(input!==pin)return alert('خطأ');if(t=='img'){blockImg=!blockImg;localStorage.setItem('n_img',blockImg?'1':'0');}if(t=='vid'){blockVid=!blockVid;localStorage.setItem('n_vid',blockVid?'1':'0');}render();}
render();
</script>
</body>
</html>
