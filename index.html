<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظيف VPN - حماية حلال</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#eef6f0;display:flex;justify-content:center}
.app{width:390px;background:#f6fbf7;min-height:100vh;padding-bottom:20px}
.top{margin:15px;background:#fff;border-radius:20px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px #0001}
.top h1{color:#0a4d2a;font-size:22px}
.banner{margin:12px 15px;background:linear-gradient(90deg,#2fb67f,#0e7a46);color:#fff;border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center}
.center{text-align:center;padding:10px}
.circle{width:160px;height:160px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#34e89e,#0a6b3a);border:4px solid #fff;color:#fff;font-size:28px;font-weight:800;box-shadow:0 12px 30px #0a6b3a55;animation:pulse 2s infinite}
.circle.on{background:radial-gradient(circle at 30% 30%,#0a6b3a,#034d27)}
.card{margin:12px 15px;background:#fff;border-radius:18px;padding:14px 18px;box-shadow:0 2px 10px #0001}
.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f0f0f0}
.badge{background:#0a6b3a;color:#fff;padding:3px 10px;border-radius:20px;font-size:12px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div><h1>نظيف VPN</h1><small>Nadhif VPN - صنع في بابل</small></div><div style="text-align:center">🛡️<br><small style="color:#0a6b3a">حماية حلال</small></div></div>
<div class="banner"><div style="font-size:32px">☪️</div><div><h3>حماية حلال معتمدة</h3><small>تصفح آمن - كلمة سر ولي الأمر فعالة</small></div></div>
<div class="center"><h2 id="st" style="color:#0a4d2a">جاهز للاتصال</h2><small id="st2">غير متصل - محمي</small></div>
<div class="center"><button id="btn" class="circle" onclick="toggle()">اتصال</button></div>
<div class="card"><div class="row"><span>🇸🇦 السعودية</span><span class="badge">الأسرع • 24ms</span></div><div class="row"><span>🇦🇪 الإمارات</span><span>42ms</span></div><div class="row"><span>🇹🇷 تركيا</span><span>68ms</span></div></div>
<p style="text-align:center;color:#888;font-size:12px;margin-top:15px">Your privacy, protected the halal way.</p>
</div>
<script>
let on=false;
let PASSWORD = "babil2026"; // <-- غير كلمة السر هنا
function toggle(){
 let b=document.getElementById('btn'),s=document.getElementById('st'),s2=document.getElementById('st2');
 if(!on){
  b.innerText='...';s.innerText='جاري الاتصال...';
  setTimeout(()=>{b.innerText='متصل ✅';b.classList.add('on');s.innerText='متصل الآن';s2.innerText='محمي - صنع في بابل';on=true},1000)
 } else {
  let p=prompt("🔒 لإيقاف الحماية، ادخل كلمة سر ولي الأمر:");
  if(p===PASSWORD){
   b.innerText='اتصال';b.classList.remove('on');s.innerText='جاهز للاتصال';s2.innerText='غير متصل';on=false
  } else if(p!==null){
   alert("❌ كلمة السر خطأ! لا يمكن ايقاف الحماية");
  }
 }
}
</script>
</body>
</html>
